                        <h3 class="text-base md:text-xl font-bold mb-1 tracking-wider">${c.name}</h3>
                        <div class="bio-text">${bioHtml}</div>
                        <div class="mt-auto nrp-bg-orange text-white py-2 rounded-xl font-bold text-[10px] md:text-sm leading-tight text-center">
                            ${c.office} 출마선언
                        </div>
                    </div>
                </div>
            `;
        }

        function renderOriginalView() {
            updateNavActive('btn-original');
            const container = document.getElementById('content-area');
            container.innerHTML = `
                <section id="provincial-exec" class="scroll-mt-24">
                    <h2 class="section-title">광역자치단체장</h2>
                    <div class="grid-responsive">${candidates.filter(c => c.category === "광역단체장").map(createCard).join('')}</div>
                </section>
                <section id="local-exec" class="scroll-mt-24">
                    <h2 class="section-title">기초자치단체장</h2>
                    <div class="grid-responsive">${candidates.filter(c => c.category === "기초단체장").map(createCard).join('')}</div>
                </section>
                <section id="provincial-council" class="scroll-mt-24">
                    <h2 class="section-title">광역의회의원</h2>
                    <div class="grid-responsive">${candidates.filter(c => c.category === "광역의원").map(createCard).join('')}</div>
                </section>
                <section id="local-council" class="mb-16 scroll-mt-24">
                    <h2 class="section-title">기초의회의원</h2>
                    <div class="mb-10">
                        <h3 class="sub-section-title">대전광역시</h3>
                        <div class="grid-responsive">${candidates.filter(c => c.category === "기초의원" && c.metropolitan === "대전광역시").map(createCard).join('')}</div>
                    </div>
                    <div>
                        <h3 class="sub-section-title">기타 지역</h3>
                        <div class="grid-responsive">${candidates.filter(c => c.category === "기초의원" && c.metropolitan !== "대전광역시").map(createCard).join('')}</div>
                    </div>
                </section>
            `;
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        function renderRegionView() {
            updateNavActive('btn-region');
            const container = document.getElementById('content-area');
            const metros = ["서울특별시", "부산광역시", "인천광역시", "광주광역시", "대전광역시", "세종특별자치시", "경기도", "충청남도", "경상북도", "전북특별자치도"];
            let html = '<div class="mb-16">';
            metros.forEach(m => {
                const regionalCandidates = candidates.filter(c => 
                    c.region.includes(m.substring(0,2)) || 
                    c.metropolitan === m || 
                    c.region === m
                );
                if(regionalCandidates.length > 0) {
                    html += `
                        <section class="mb-12 scroll-mt-24">
                            <h2 class="section-title">${m}</h2>
                            <div class="grid-responsive">${regionalCandidates.map(createCard).join('')}</div>
                        </section>
                    `;
                }
            });
            html += '</div>';
            container.innerHTML = html;
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        function scrollToId(id) {
            if (document.getElementById('btn-region').classList.contains('active')) {
                renderOriginalView();
                setTimeout(() => {
                    const el = document.getElementById(id);
                    if (el) el.scrollIntoView({ behavior: 'smooth' });
                }, 100);
            } else {
                const el = document.getElementById(id);
                if (el) el.scrollIntoView({ behavior: 'smooth' });
            }
        }

        function updateNavActive(activeId) {
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            const target = document.getElementById(activeId);
            if(target) target.classList.add('active');
        }

        function updateDDay() {
            const targetDate = new Date('2026-06-03');
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            targetDate.setHours(0, 0, 0, 0);
            const diffTime = targetDate - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            const badge = document.getElementById('d-day-badge');
            if (diffDays > 0) badge.innerText = `D-${diffDays}`;
            else if (diffDays === 0) badge.innerText = 'D-Day';
            else badge.innerText = `D+${Math.abs(diffDays)}`;
        }

        window.onload = function() {
            updateDDay();
            renderOriginalView();
        };
    </script>
</body>
</html>
