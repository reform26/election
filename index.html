<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>개혁 2026</title>

    <!-- Favicon: 🍊 Emoji -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍊</text></svg>">

    <!-- Global site tag (gtag.js) - Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-9L6DLJ2XKB"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-9L6DLJ2XKB');
    </script>

    <!-- Microsoft Clarity -->
    <script type="text/javascript">
        (function(c,l,a,r,i,t,y){
            c[a]=c[l]||function(){(c[a].q=c[a].q||[]).push(arguments)};
            t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
            y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        })(window, document, "clarity", "script", "v2ogrkuyk0");
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body {
            font-family: 'Inter', 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            scroll-behavior: smooth;
        }
        .gradient-bg {
            background: radial-gradient(circle at top right, #fff7ed 0%, #ffedd5 100%);
        }
        .dark .gradient-bg {
            background: radial-gradient(circle at top right, #0f172a 0%, #020617 100%);
        }
        @keyframes fade-up {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-up {
            animation: fade-up 0.8s ease-out forwards;
        }
        .delay-100 { animation-delay: 0.1s; }
        .delay-200 { animation-delay: 0.2s; }
        .delay-300 { animation-delay: 0.3s; }
        
        .modal-enter {
            animation: modal-in 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes modal-in {
            from { opacity: 0; transform: scale(0.9) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .dark .force-white-dark {
            color: #ffffff !important;
        }
        .dark .force-orange-dark {
            color: #fb923c !important; /* orange-400 */
        }
        .dark .force-light-gray-dark {
            color: #f1f5f9 !important; /* slate-100 */
        }
    </style>
    <script>
        // 초기 다크모드 설정
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
</head>
<body class="gradient-bg min-h-screen text-slate-900 dark:text-slate-100 overflow-x-hidden transition-colors duration-300">

    <nav class="fixed top-0 w-full z-50 px-4 md:px-6 py-4 bg-white/40 dark:bg-slate-900/60 backdrop-blur-md border-b border-orange-200/30 dark:border-slate-800/50">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 bg-orange-600 rounded-lg flex items-center justify-center shadow-lg shadow-orange-600/20">
                    <i data-lucide="vote" class="text-white w-5 h-5"></i>
                </div>
                <span class="text-lg md:text-xl font-bold tracking-tight text-slate-800 dark:text-white">개혁 2026</span>
            </div>
            
            <!-- 다크모드 토글 버튼 -->
            <button id="theme-toggle" class="p-2.5 rounded-xl bg-white/50 dark:bg-slate-800/50 border border-orange-100 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:scale-110 active:scale-95 transition-all">
                <i data-lucide="sun" id="sun-icon" class="w-5 h-5 hidden"></i>
                <i data-lucide="moon" id="moon-icon" class="w-5 h-5 hidden"></i>
            </button>
        </div>
    </nav>

    <main class="relative pt-32 pb-20 px-5 md:px-6 min-h-screen flex flex-col items-center justify-center overflow-hidden">
        <div class="absolute top-1/4 -left-20 w-72 h-72 bg-orange-200 dark:bg-orange-500/10 rounded-full mix-blend-screen filter blur-3xl opacity-30 animate-pulse"></div>
        <div class="absolute bottom-1/4 -right-20 w-80 h-80 bg-amber-200 dark:bg-amber-500/10 rounded-full mix-blend-screen filter blur-3xl opacity-30 animate-pulse" style="animation-delay: 2s"></div>

        <div class="max-w-4xl w-full text-center relative z-10">
            <h1 class="text-3xl sm:text-4xl md:text-6xl font-bold tracking-tight mb-6 animate-fade-up leading-[1.15] md:leading-tight">
                <span class="text-slate-900 dark:text-white force-white-dark block mb-2">제9회 전국동시지방선거를 향한</span>
                <span class="text-orange-600 force-orange-dark">개혁의 도전</span>
            </h1>
            
            <p class="text-base sm:text-lg md:text-xl text-slate-600 dark:text-slate-100 force-light-gray-dark mb-10 md:mb-12 max-w-2xl mx-auto leading-relaxed animate-fade-up delay-100 px-4 font-medium">
                6월 지방선거의 후보자 명단을 확인하고<br class="hidden sm:block"/>
                실시간으로 업데이트되는 선거결과를 확인하세요.
            </p>

            <div class="flex flex-col md:flex-row items-center justify-center gap-4 md:gap-6 animate-fade-up delay-200 mb-10 w-full px-2">
                <!-- 왼쪽 버튼: 지방선거 결과 보기 (모달 실행) -->
                <button id="btn-results" class="group relative w-full md:w-80 h-20 md:h-24 bg-orange-600 dark:bg-orange-500 text-white rounded-2xl shadow-xl shadow-orange-600/20 overflow-hidden transition-all hover:scale-[1.02] active:scale-[0.98] flex items-center justify-between px-6 md:px-8">
                    <div class="flex flex-col items-start text-left">
                        <span class="text-[10px] md:text-xs opacity-95 font-bold tracking-tight mb-0.5">- 준비중: 개표완료후 공개예정 -</span>
                        <span class="text-lg md:text-xl font-bold">지방선거 결과 보기</span>
                    </div>
                    <div class="w-10 h-10 md:w-12 md:h-12 bg-white/20 rounded-full flex items-center justify-center group-hover:bg-white/30 transition-colors">
                        <i data-lucide="bar-chart-3" class="w-5 h-5 md:w-6 md:h-6 text-white"></i>
                    </div>
                </button>

                <!-- 오른쪽 버튼: 후보자 명단 보기 (외부 링크) -->
                <a href="https://restep.cc/can/" class="group relative w-full md:w-80 h-20 md:h-24 bg-white dark:bg-slate-800 text-slate-800 dark:text-white rounded-2xl border border-orange-100 dark:border-slate-700 shadow-lg shadow-orange-100/50 dark:shadow-none overflow-hidden transition-all hover:scale-[1.02] active:scale-[0.98] flex items-center justify-between px-6 md:px-8">
                    <div class="flex flex-col items-start text-left">
                        <span class="text-[10px] md:text-xs text-orange-500 dark:text-orange-400 font-bold tracking-wider">CANDIDATE INFO</span>
                        <span class="text-lg md:text-xl font-bold">후보자 명단 보기</span>
                    </div>
                    <div class="w-10 h-10 md:w-12 md:h-12 bg-orange-50 dark:bg-slate-700 rounded-full flex items-center justify-center group-hover:bg-orange-100 dark:group-hover:bg-slate-600 transition-colors">
                        <i data-lucide="users" class="w-5 h-5 md:w-6 md:h-6 text-orange-600 dark:text-orange-400"></i>
                    </div>
                </a>
            </div>

            <div class="animate-fade-up delay-300 w-full max-w-2xl mx-auto px-2">
                <a href="https://restep.kro.kr/" target="_blank" class="flex items-center justify-between p-4 md:p-5 bg-orange-100/50 dark:bg-slate-800/60 hover:bg-orange-100 dark:hover:bg-slate-700 border border-orange-200 dark:border-slate-600 rounded-2xl text-orange-800 dark:text-orange-300 transition-all group shadow-sm">
                    <div class="flex items-center space-x-3 md:space-x-4">
                        <div class="w-9 h-9 md:w-10 md:h-10 bg-white dark:bg-slate-700 rounded-xl flex items-center justify-center shadow-sm">
                            <i data-lucide="map" class="w-4 h-4 md:w-5 md:h-5 text-orange-600 dark:text-orange-400"></i>
                        </div>
                        <span class="font-bold text-sm md:text-base text-left">이준석 대표 지방선거 유세동선 지도</span>
                    </div>
                    <i data-lucide="chevron-right" class="w-4 h-4 md:w-5 md:h-5 opacity-60 group-hover:opacity-100 group-hover:translate-x-1 transition-all"></i>
                </a>
            </div>
        </div>
    </main>

    <div id="modal-overlay" class="fixed inset-0 z-[100] bg-slate-900/60 dark:bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 sm:p-6 hidden opacity-0 transition-opacity duration-300">
        <div id="modal-content" class="bg-white dark:bg-slate-900 w-full max-w-sm md:max-w-md rounded-[2rem] shadow-2xl overflow-hidden transform transition-all duration-300">
            <div class="p-6 md:p-8 text-center">
                <div class="w-16 h-16 md:w-20 md:h-20 bg-orange-100 dark:bg-orange-900/30 text-orange-600 dark:text-orange-500 rounded-full flex items-center justify-center mx-auto mb-6">
                    <i data-lucide="construction" class="w-8 h-8 md:w-10 md:h-10"></i>
                </div>
                <h3 class="text-xl md:text-2xl font-bold text-slate-900 dark:text-white mb-2">서비스 준비 중입니다</h3>
                <p class="text-sm md:text-base text-slate-600 dark:text-slate-300 mb-8 leading-relaxed px-4">
                    지방선거 결과 페이지는<br/>
                    <strong class="text-orange-600 dark:text-orange-500 font-bold">개표완료후 정리하여 오픈할 예정</strong>입니다.
                </p>
                <button id="modal-close" class="w-full py-4 bg-slate-900 dark:bg-orange-600 text-white rounded-2xl font-semibold hover:bg-slate-800 dark:hover:bg-orange-500 active:scale-95 transition-all">
                    확인하였습니다
                </button>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        const themeToggleBtn = document.getElementById('theme-toggle');
        const sunIcon = document.getElementById('sun-icon');
        const moonIcon = document.getElementById('moon-icon');

        function updateThemeIcons() {
            if (document.documentElement.classList.contains('dark')) {
                sunIcon.classList.remove('hidden');
                moonIcon.classList.add('hidden');
            } else {
                sunIcon.classList.add('hidden');
                moonIcon.classList.remove('hidden');
            }
        }
        updateThemeIcons();

        themeToggleBtn.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            localStorage.theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
            updateThemeIcons();
        });

        const modalOverlay = document.getElementById('modal-overlay');
        const modalContent = document.getElementById('modal-content');
        const btnResults = document.getElementById('btn-results');
        const btnClose = document.getElementById('modal-close');

        function showModal() {
            modalOverlay.classList.remove('hidden');
            setTimeout(() => {
                modalOverlay.classList.add('opacity-100');
                modalContent.classList.add('modal-enter');
            }, 10);
        }

        function hideModal() {
            modalOverlay.classList.remove('opacity-100');
            modalContent.classList.remove('modal-enter');
            setTimeout(() => modalOverlay.classList.add('hidden'), 300);
        }

        btnResults.addEventListener('click', showModal);
        btnClose.addEventListener('click', hideModal);
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) hideModal();
        });
    </script>
</body>
</html>
